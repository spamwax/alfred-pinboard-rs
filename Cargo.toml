[package]
name = "alfred-chrome-bookmarks"
version = "0.1.0"
authors = [ "Claude AI",]
edition = "2021"

[dependencies]
alfred = "4.0.1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
structopt = "0.3.15"
thiserror = "1.0"
dirs = "5.0"
log = "0.4"
env_logger = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
fuzzy-matcher = "0.3"

[dependencies.alfred-rs]
version = "0.7"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[profile.release]
lto = true

[package.metadata.docs.rs]
targets = [ "x86_64-apple-darwin",]
